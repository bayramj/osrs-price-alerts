name: OSRS Price Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check OSRS prices
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_prices.py

      - name: Save alert state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add alert_state.json
          git diff --cached --quiet || git commit -m "Update alert state"
          git push
